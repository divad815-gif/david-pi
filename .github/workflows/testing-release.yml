name: Promote tested beta

on:
  push:
    tags: ['v*-beta.*']

permissions:
  contents: read

concurrency:
  group: testing-release
  cancel-in-progress: false

jobs:
  promote:
    environment: testing-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      BETA_TAG: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
      ANDROID_BUILD_TOOLS_VERSION: 35.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.20.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.1.3
          daemon-config: |
            {"features":{"containerd-snapshotter":true},"max-concurrent-uploads":2}
      - uses: docker/setup-buildx-action@v3
      - name: Install verification tools only
        run: |
          pip install -r requirements.txt
          sdkmanager "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "platforms;android-35"
          echo "ANDROID_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - name: Authenticate package upload without signing keys
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify tag-bound candidates and promote without rebuilding
        run: |
          python scripts/testing_transfer.py promote --tag "$BETA_TAG" --repository "$REPOSITORY" --output work/actions-beta
      - name: Preserve sanitized publication progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-publication-progress
          path: work/actions-beta/candidate/publication-receipt.json
          if-no-files-found: ignore
          retention-days: 14
