name: Publish verified beta registry content

on:
  push:
    branches: ['publication/beta1-driver']

permissions:
  contents: read

concurrency:
  group: testing-release
  cancel-in-progress: false

jobs:
  registry:
    if: github.repository == 'divad815-gif/david-pi'
    environment: testing-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # Draft discovery/download needs write-level repository visibility. The
      # driver stops before every release/asset mutation.
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISHER_REVISION: ${{ github.sha }}
      ANDROID_BUILD_TOOLS_VERSION: 35.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1c1dc0df31ba49a9759d88a02ab490b2c7d2d873
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the exact verified Temurin runtime
        run: |
          beta_jdk_archive="$RUNNER_TEMP/verified-beta-jdk.tar.gz"
          beta_jdk_root="$RUNNER_TEMP/verified-beta-jdk"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --connect-timeout 15 --max-time 300 --retry 3 \
            'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_x64_linux_hotspot_17.0.20.1_1.tar.gz' \
            --output "$beta_jdk_archive"
          printf '%s  %s\n' '3808d1d15e3ec6bd5b84057fb5d84c33d8a1536a258146bcea2e603fc726e08e' "$beta_jdk_archive" | sha256sum --check -
          mkdir "$beta_jdk_root"
          tar -xzf "$beta_jdk_archive" -C "$beta_jdk_root" --strip-components=1
          echo "JAVA_HOME=$beta_jdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_JAVA=$beta_jdk_root/bin/java" >> "$GITHUB_ENV"
          echo "$beta_jdk_root/bin" >> "$GITHUB_PATH"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.1.3
          daemon-config: |
            {"features":{"containerd-snapshotter":true},"max-concurrent-uploads":2}
      - uses: docker/setup-buildx-action@v3
      - name: Install verification tools only
        working-directory: candidate-source
        run: |
          pip install -r requirements.txt
          sdkmanager "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "platforms;android-35"
          echo "ANDROID_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - name: Authenticate registry upload without signing keys
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify the staged candidate and publish only its exact registry content
        working-directory: candidate-source
        run: |
          python ../publisher/scripts/promote_staged_beta_registry.py \
            --source . --output work/actions-beta \
            --repository divad815-gif/david-pi --tag v10.0.0-beta.1 \
            --release-id 395277063 \
            --expected-revision 1c1dc0df31ba49a9759d88a02ab490b2c7d2d873 \
            --expected-transfer-sha256 be0d78881e1cd84df4706c7526ec96f1b7936871cb452d1b9f3c73bcaed87a9e \
            --candidate-receipt-sha256 ae395d64708e07099af47113f57e48356ce2440e103249693ec6ca1edeb94bbc \
            --acceptance-sha256 485ba212e7cfb18f35a62eaa5ab9297d5c2b6037ed39464a164c73490df670df \
            --publisher-revision "$PUBLISHER_REVISION"
      - name: Preserve sanitized registry progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-registry-progress
          path: candidate-source/work/actions-beta/candidate/publication-receipt.json
          if-no-files-found: ignore
          retention-days: 14
