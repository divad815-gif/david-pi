[Service]
RuntimeDirectory=david-pi-data-backup david-pi-writer-transition
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=yes
StateDirectory=david-pi-data-backup
StateDirectoryMode=0700
ExecStartPre=/usr/local/sbin/david_pi_backup_quiescence.py recover
ExecStartPre=/usr/local/sbin/david_pi_backup_quiescence.py record-running
ExecStopPost=/usr/local/sbin/david_pi_backup_quiescence.py recover
ReadWritePaths=/run/david-pi-data-backup /run/david-pi-writer-transition /var/lib/david-pi-data-backup
