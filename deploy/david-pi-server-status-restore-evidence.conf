# Install only after the receipt directory/sentinel and key exist.  The base
# collector remains operational without this drop-in and reports evidence as
# unconfigured instead of assuming restore success.
[Service]
LoadCredential=restore-evidence-key:/etc/david-pi/backup-manifest.key
Environment=DAVID_PI_RESTORE_EVIDENCE_KEY_FILE=restore-evidence-key
ReadOnlyPaths=/var/lib/david-pi-recovery
