<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">Private access and independent storage</title><desc id="desc">Each admitted household member uses Tailscale to reach the private HTTPS home server. The server keeps content on a local ext4 data drive and copies backups to a separate physical drive. External movie and recipe services can be skipped.</desc><rect width="960" height="390" rx="18" fill="#f5f7fa"/><g font-family="system-ui,sans-serif" fill="#152b40"><text x="30" y="44" font-size="24" font-weight="700">Private household access, separate backup storage</text><rect x="30" y="86" width="220" height="90" rx="12" fill="#e0eaff"/><text x="48" y="116" font-size="18">Your phone or computer</text><text x="48" y="145" font-size="14">Each person's own login</text><rect x="337" y="86" width="270" height="90" rx="12" fill="#deedf4"/><text x="355" y="116" font-size="18">Tailscale private HTTPS</text><text x="355" y="145" font-size="14">Admission required in the portal</text><rect x="694" y="86" width="236" height="90" rx="12" fill="#dff1e8"/><text x="712" y="116" font-size="18">John's home</text><text x="712" y="145" font-size="14">Your Pi or Linux PC</text><text x="277" y="139" font-size="24">→</text><text x="632" y="139" font-size="24">→</text><path d="M810 180V207H370V231 M810 207V231" stroke="#546a80" stroke-width="2" fill="none"/><rect x="245" y="236" width="255" height="104" rx="12" fill="#e8e7f8"/><text x="265" y="269" font-size="18">Primary data drive</text><text x="265" y="296" font-size="14">Prepared local ext4 storage</text><text x="265" y="320" font-size="14">Your saved household content</text><rect x="670" y="236" width="260" height="104" rx="12" fill="#fff0d6"/><text x="690" y="269" font-size="18">Independent backup</text><text x="690" y="296" font-size="14">A different physical drive</text><text x="690" y="320" font-size="14">Optional; restore must be tested</text><path d="M505 286H655" stroke="#546a80" stroke-width="2" stroke-dasharray="6 5"/><text x="522" y="276" font-size="13">backup copy →</text></g></svg>
