<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">Your server setup, from machine to private household portal</title><desc id="desc">Connect your machine to Tailscale, claim the administrator, choose your server name and storage, select optional modules, then verify. Example John chooses John’s home with john-pi as the suggested hostname.</desc>
<rect width="1000" height="340" fill="#f4f6f8" rx="20"/>
<g font-family="system-ui,sans-serif" fill="#14263c"><text x="32" y="44" font-size="24" font-weight="700">Your home server, your choices</text><text x="32" y="76" font-size="15">Required private access first. Optional services can be added later.</text></g>
<g font-family="system-ui,sans-serif" font-size="17" fill="#14263c">
<rect x="32" y="108" width="210" height="78" fill="#d9eaff" rx="12"/><text x="49" y="139">1 · Check the machine</text><text x="49" y="166" font-size="14">Connect Tailscale</text>
<rect x="274" y="108" width="210" height="78" fill="#d9eaff" rx="12"/><text x="291" y="139">2 · Claim your server</text><text x="291" y="166" font-size="14">Your account becomes admin</text>
<rect x="516" y="108" width="210" height="78" fill="#d9eaff" rx="12"/><text x="533" y="139">3 · Name and storage</text><text x="533" y="166" font-size="14">John’s home · john-pi</text>
<rect x="758" y="108" width="210" height="78" fill="#d9eaff" rx="12"/><text x="775" y="139">4 · Modules and check</text><text x="775" y="166" font-size="14">Skip external services freely</text>
<text x="249" y="153">→</text><text x="491" y="153">→</text><text x="733" y="153">→</text>
<rect x="32" y="218" width="936" height="84" fill="#e2f2e9" rx="12"/><text x="50" y="249" font-weight="600">Your private address comes from Tailscale</text><text x="50" y="276" font-size="16">https://john-pi.your-tailnet.ts.net · Each household member signs in with their own identity</text>
</g></svg>
